<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Signal Street">
  <!-- Signal Street app icon (A7 "two-tone live line"), Material 3 tonal colours from seed #1a73e8:
       light: primary #005AC1, on-primary #FFFFFF, live green #6DD58C
       dark:  primary container #004494, on-primary-container #D8E2FF, live green #6DD58C -->
  <style>
    .bg { fill: #005AC1 } .ln { stroke: #FFFFFF } .live { fill: #6DD58C }
    @media (prefers-color-scheme: dark) { .bg { fill: #004494 } .ln { stroke: #D8E2FF } }
  </style>
  <rect class="bg" width="96" height="96" rx="28"/>
  <circle class="live" cx="70" cy="32" r="14" opacity=".35"/>
  <polyline class="ln" points="22,66 38,50 50,59 70,32" fill="none" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="live" cx="70" cy="32" r="8"/>
</svg>
